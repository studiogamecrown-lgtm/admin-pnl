<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="theme-color" content="#08080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VF Admin">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Value Finder — Admin</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">Vf</div>
      <div>
        <div class="name">Value Finder</div>
        <div class="sub">Admin Panel</div>
      </div>
    </div>
    <div class="section-label">Devices</div>
    <div id="deviceList" class="device-list"><div class="loading">Loading...</div></div>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </aside>
  <main class="main" id="main">
    <div class="empty">
      <div class="empty-icon">📱</div>
      <div class="empty-title">Select a device</div>
      <div class="empty-sub">Choose a device from the sidebar.</div>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Value Finder — Admin</title>
<meta name="theme-color" content="#08080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VF Admin">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe58a"/>
              <stop offset="1" stop-color="#a87d1c"/>
            </linearGradient>
          </defs>
          <path d="M16 3 L29 16 L16 29 L3 16 Z" fill="url(#g)"/>
          <path d="M16 9 L23 16 L16 23 L9 16 Z" fill="#08080c" opacity="0.6"/>
          <path d="M16 13 L19 16 L16 19 L13 16 Z" fill="url(#g)"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="name">Value Finder</div>
        <div class="sub">Admin Panel</div>
      </div>
      <button class="icon-btn sidebar-close" id="closeSidebar" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6 L18 18 M18 6 L6 18"/>
        </svg>
      </button>
    </div>

    <div class="section-label">Devices</div>
    <div id="deviceList" class="device-list">
      <div class="loading">Loading…</div>
    </div>

    <button id="installBtnSide" class="install-btn install-btn--block" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/>
      </svg>
      Install App
    </button>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </aside>

  <div class="content">

    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <div class="topbar-title">Value Finder</div>
      <button id="installBtnTop" class="install-btn" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/>
        </svg>
        Install
      </button>
    </header>

    <main class="main" id="main">
      <div class="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 48 48" width="56" height="56">
            <path d="M24 6 L42 24 L24 42 L6 24 Z" fill="none" stroke="#e5b94a" stroke-width="1.5"/>
            <path d="M24 16 L32 24 L24 32 L16 24 Z" fill="#e5b94a" opacity="0.35"/>
          </svg>
        </div>
        <div class="empty-title">Select a device</div>
        <div class="empty-sub">Choose a device from the sidebar to view details.</div>
      </div>
    </main>

  </div>
</div>

<div class="ios-toast" id="iosToast">
  <div class="ios-toast-title">Install Value Finder</div>
  <div class="ios-toast-body">Tap <b>Share</b> then <b>Add to Home Screen</b>.</div>
</div>

<script src="/app.js"></script>
<script>
(function () {
  // ── service worker ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }

  // ── sidebar drawer (mobile) ──
  var sidebar  = document.getElementById('sidebar');
  var backdrop = document.getElementById('sidebarBackdrop');
  var menuBtn  = document.getElementById('menuBtn');
  var closeBtn = document.getElementById('closeSidebar');
  var deviceList = document.getElementById('deviceList');

  function openSidebar() {
    sidebar.classList.add('open');
    backdrop.classList.add('show');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    backdrop.classList.remove('show');
  }

  if (menuBtn)  menuBtn.addEventListener('click', openSidebar);
  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (backdrop) backdrop.addEventListener('click', closeSidebar);
  if (deviceList) {
    deviceList.addEventListener('click', function () {
      if (window.innerWidth <= 900) closeSidebar();
    });
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSidebar();
  });

  // ── install prompt ──
  var installBtns = [
    document.getElementById('installBtnTop'),
    document.getElementById('installBtnSide')
  ].filter(Boolean);
  var iosToast = document.getElementById('iosToast');
  var deferredPrompt = null;

  function showInstall() { installBtns.forEach(function (b) { b.hidden = false; }); }
  function hideInstall() { installBtns.forEach(function (b) { b.hidden = true; }); }

  var isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  if (isStandalone) hideInstall();

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    showInstall();
  });

  window.addEventListener('appinstalled', function () {
    hideInstall();
    deferredPrompt = null;
  });

  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (isIOS && !isStandalone) showInstall();

  function handleInstall() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (choice) {
        if (choice.outcome === 'accepted') hideInstall();
        deferredPrompt = null;
      });
      return;
    }
    if (isIOS && iosToast) {
      iosToast.classList.add('show');
      setTimeout(function () { iosToast.classList.remove('show'); }, 5500);
    }
  }

  installBtns.forEach(function (b) { b.addEventListener('click', handleInstall); });
})();
</script>
</body>
</html>

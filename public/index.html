<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Value Finder — Admin</title>
<meta name="theme-color" content="#08080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VF Admin">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffe58a"/>
              <stop offset="1" stop-color="#a87d1c"/>
            </linearGradient>
          </defs>
          <path d="M16 3 L29 16 L16 29 L3 16 Z" fill="url(#g)"/>
          <path d="M16 9 L23 16 L16 23 L9 16 Z" fill="#08080c" opacity="0.6"/>
          <path d="M16 13 L19 16 L16 19 L13 16 Z" fill="url(#g)"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="name">Value Finder</div>
        <div class="sub">Admin Panel</div>
      </div>
      <button class="icon-btn sidebar-close" id="closeSidebar" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6 L18 18 M18 6 L6 18"/>
        </svg>
      </button>
    </div>

    <div class="section-label">Devices</div>
    <div id="deviceList" class="device-list">
      <div class="loading">Loading…</div>
    </div>

    <button id="installBtnSide" class="install-btn install-btn--block" hidden>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/>
      </svg>
      Install App
    </button>
    <button id="logoutBtn" class="logout-btn">Logout</button>
  </aside>

  <div class="content">

    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <div class="topbar-title">Value Finder</div>
      <button id="installBtnTop" class="install-btn" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/>
        </svg>
        Install
      </button>
    </header>

    <main class="main" id="main">
      <div class="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 48 48" width="56" height="56">
            <path d="M24 6 L42 24 L24 42 L6 24 Z" fill="none" stroke="#e5b94a" stroke-width="1.5"/>
            <path d="M24 16 L32 24 L24 32 L16 24 Z" fill="#e5b94a" opacity="0.35"/>
          </svg>
        </div>
        <div class="empty-title">Select a device</div>
        <div class="empty-sub">Choose a device from the sidebar to view details.</div>
      </div>
    </main>

  </div>
</div>

<div class="ios-toast" id="iosToast">
  <div class="ios-toast-title">Install Value Finder</div>
  <div class="ios-toast-body">Tap <b>Share</b> then <b>Add to Home Screen</b>.</div>
</div>

<script src="/app.js"></script>
<script>
(function () {
  // ── service worker ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('[SW] registered', reg.scope))
      .catch(err => console.error('[SW] failed', err));
  }

  // ── sidebar drawer (mobile) ──
  var sidebar    = document.getElementById('sidebar');
  var backdrop   = document.getElementById('sidebarBackdrop');
  var menuBtn    = document.getElementById('menuBtn');
  var closeBtn   = document.getElementById('closeSidebar');
  var deviceList = document.getElementById('deviceList');

  function openSidebar()  { sidebar.classList.add('open'); backdrop.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); backdrop.classList.remove('show'); }

  if (menuBtn)    menuBtn.addEventListener('click', openSidebar);
  if (closeBtn)   closeBtn.addEventListener('click', closeSidebar);
  if (backdrop)   backdrop.addEventListener('click', closeSidebar);
  if (deviceList) deviceList.addEventListener('click', function () {
    if (window.innerWidth <= 900) closeSidebar();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSidebar();
  });

  // ── install prompt ──
  var installBtns = [
    document.getElementById('installBtnTop'),
    document.getElementById('installBtnSide')
  ].filter(Boolean);
  var iosToast = document.getElementById('iosToast');
  var deferredPrompt = null;

  var isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

  console.log('[PWA] isStandalone:', isStandalone, 'isIOS:', isIOS, 'isSafari:', isSafari);

  if (isStandalone) {
    installBtns.forEach(function (b) { b.hidden = true; });
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    console.log('[PWA] beforeinstallprompt fired');
    e.preventDefault();
    deferredPrompt = e;
  });

  window.addEventListener('appinstalled', function () {
    console.log('[PWA] app installed');
    deferredPrompt = null;
    installBtns.forEach(function (b) { b.hidden = true; });
    if (iosToast) iosToast.classList.remove('show');
  });

  function showToast(html, ms) {
    if (!iosToast) return;
    iosToast.querySelector('.ios-toast-body').innerHTML = html;
    iosToast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      iosToast.classList.remove('show');
    }, ms || 6000);
  }

  function handleInstall() {
    console.log('[PWA] install clicked. deferredPrompt:', !!deferredPrompt);

    // 1. native prompt (Chrome / Edge / Android)
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (choice) {
        console.log('[PWA] userChoice:', choice.outcome);
        deferredPrompt = null;
      });
      return;
    }

    // 2. iOS Safari
    if (isIOS) {
      showToast('Tap <b>Share</b> <span style="opacity:.6">(square + arrow)</span> then <b>Add to Home Screen</b>.', 7000);
      return;
    }

    // 3. Android without prompt
    if (/android/i.test(navigator.userAgent)) {
      showToast('Open browser menu <b>⋮</b> → <b>Install app</b> / <b>Add to Home screen</b>.', 7000);
      return;
    }

    // 4. Safari desktop
    if (isSafari) {
      showToast('Safari desktop: <b>File</b> → <b>Add to Dock</b>.', 7000);
      return;
    }

    // 5. Chrome / Edge desktop fallback
    showToast('Look for the <b>install icon</b> in the address bar, or <b>⋮ menu</b> → <b>Install Value Finder</b>.', 7000);
  }

  installBtns.forEach(function (b) {
    b.addEventListener('click', handleInstall);
  });

  // manual test hook: window.__vfInstall()
  window.__vfInstall = handleInstall;
})();
</script>
</body>
</html>

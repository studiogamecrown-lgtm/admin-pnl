      <stop offset="0" stop-color="#141420"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="0.5" stop-color="#e5b94a"/>
